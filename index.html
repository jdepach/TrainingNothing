<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1a3a">
<title>TrainingNothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a3a;--paper:#f4f1fb;--c0:#e0245e;--c1:#0c8f8c;--c2:#5b3fd1;--amber:#ffb400;--mute:#67638a;--line:#dcd6ee}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.4 'Barlow',system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:16px}
h1{margin:4px 0 0;font:400 22px/1 'Anton',Impact,sans-serif;letter-spacing:.04em}
h2{margin:0;font:400 22px/1.1 'Anton',Impact,sans-serif;letter-spacing:.03em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.timer{background:var(--ink);color:#fff;border-radius:22px;padding:22px 18px 18px;text-align:center}
.dial{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:0 auto 18px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:12}
.track{stroke:rgba(255,255,255,.16)}
#ring{stroke:#fff;stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0}
#time{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(60px,20vw,88px)/1 'Anton',Impact,sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer.low #ring{stroke:var(--amber)}
.timer.low #time{color:var(--amber)}
.timer.done{background:var(--amber);color:var(--ink);animation:flash .5s 4}
.timer.done .track{stroke:rgba(29,26,58,.18)}
.timer.done #ring{stroke:var(--ink)}
@keyframes flash{50%{background:var(--ink);color:#fff}}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}

.btn{min-height:52px;padding:0 16px;border:0;border-radius:14px;font-weight:700;font-size:18px;background:#fff;color:var(--ink)}
.btn.primary{background:var(--amber);color:var(--ink)}
.timer .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}
.timer.done .btn.ghost{color:var(--ink);border-color:rgba(29,26,58,.4)}

.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.card.next{background:transparent;border-style:dashed}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.tag{color:var(--mute);font-weight:700}
label{display:block;margin-bottom:12px;font-weight:700}
label span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:var(--c)}
input{display:block;width:100%;margin-top:6px;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.hint{margin:0 0 14px;color:var(--mute)}
.card .btn.primary{width:100%}
.link{display:block;margin:6px auto 0;padding:10px;border:0;background:none;color:var(--mute);font-weight:700;text-decoration:underline}

.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs{color:var(--mute);font-weight:700}
.tm{display:grid;place-items:center;text-align:center;min-height:84px;padding:8px;border-radius:14px;color:#fff;font:400 24px/1.1 'Anton',Impact,sans-serif;letter-spacing:.02em;overflow-wrap:anywhere}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}
.next .tm{min-height:56px;font-size:18px}
.rest{margin:12px 0 0;text-align:center;color:var(--mute)}
.rest b{color:var(--ink)}
.go{margin-top:14px}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.sub{margin:20px 0 6px}
.orow{padding:10px 0;border-top:1px solid var(--line)}
.otitle{margin-bottom:8px}
.olab{color:var(--mute);font-size:14px;margin-bottom:4px}
.ochips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:44px;padding:4px 6px;border:2px solid var(--c);border-radius:10px;background:#fff;color:var(--c);font-weight:700;overflow-wrap:anywhere}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.k0{--c:var(--c0)}.k1{--c:var(--c1)}.k2{--c:var(--c2)}
.oact{display:flex;gap:8px;margin:8px 0 18px}
.oact .btn{flex:1;min-height:44px;font-size:16px;border:2px solid var(--line)}

@media (prefers-reduced-motion:reduce){.timer.done{animation:none}}
</style>
</head>
<body>
<main>
  <h1>TrainingNothing</h1>

  <section class="timer" id="timer" aria-label="Minuteur">
    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"/>
        <circle id="ring" cx="100" cy="100" r="90"/>
      </svg>
      <div id="time" role="timer">2:15</div>
    </div>
    <div class="row">
      <button class="btn primary" id="play">Démarrer</button>
      <button class="btn ghost" id="reset">Réinitialiser</button>
    </div>
  </section>

  <div id="teams"></div>
</main>

<script>
const DURATION = 135; // 2 min 15 s
const C = 565.49;
const KEY = 'trainingnothing-v2';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let st = {mode:'setup', t:['', '', ''], jam:0, rest:[2, 0, 1]};
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

/* ---------- Minuteur ---------- */
let remaining = DURATION * 1000, running = false, finished = false, endAt = 0, timerId = null, ac = null, wl = null;

const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function drawTimer() {
  $('time').textContent = fmt(remaining);
  $('ring').style.strokeDashoffset = (C * (1 - remaining / (DURATION * 1000))).toFixed(1);
  $('timer').classList.toggle('low', remaining > 0 && remaining <= 15000);
  $('timer').classList.toggle('done', finished);
  $('play').textContent = running ? 'Pause' : (!finished && remaining < DURATION * 1000 ? 'Reprendre' : 'Démarrer');
  document.title = running ? fmt(remaining) + ' · TrainingNothing' : 'TrainingNothing';
}

function tick() {
  remaining = Math.max(0, endAt - Date.now());
  if (remaining <= 0) { stop(); finished = true; alarm(); }
  drawTimer();
}

function stop() {
  running = false;
  clearInterval(timerId);
  try { wl && wl.release(); } catch(e) {}
  wl = null;
}

async function start() {
  if (finished) resetTimer();
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch(e) {}
  endAt = Date.now() + remaining;
  running = true;
  timerId = setInterval(tick, 100);
  try { wl = await navigator.wakeLock.request('screen'); } catch(e) {}
  drawTimer();
}

function resetTimer() {
  stop();
  remaining = DURATION * 1000;
  finished = false;
  drawTimer();
}

function alarm() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]); } catch(e) {}
  try {
    [0, .35, .7].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; g.gain.value = .2;
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .25);
    });
  } catch(e) {}
}

$('play').onclick = () => running ? (remaining = Math.max(0, endAt - Date.now()), stop(), drawTimer()) : start();
$('reset').onclick = resetTimer;

/* ---------- Rotation des 3 équipes ---------- */
// st.rest liste l'équipe au repos à chaque jam ; la séquence recommence ensuite depuis le début.
const DEFAULT_REST = [2, 0, 1];
const nm = i => st.t[i] || 'Équipe ' + (i + 1);
function readNames() {
  [0, 1, 2].forEach(i => { const el = $('in' + i); if (el) st.t[i] = el.value.trim(); });
}
function orderRows() {
  return st.rest.map((r, k) => {
    const play = [0, 1, 2].filter(i => i !== r);
    return `<div class="orow">
      <div class="otitle">Jam ${k + 1} : <b>${esc(nm(play[0]))}</b> vs <b>${esc(nm(play[1]))}</b></div>
      <div class="olab">Au repos</div>
      <div class="ochips" role="group" aria-label="Équipe au repos à la jam ${k + 1}">
        ${[0, 1, 2].map(i => `<button class="chip k${i}" aria-pressed="${i === r}" data-act="rest" data-k="${k}" data-i="${i}">${esc(nm(i))}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function matchup(n) {
  const rest = st.rest[n % st.rest.length];
  return {rest, play: [0, 1, 2].filter(i => i !== rest)};
}

function pair(n) {
  const m = matchup(n), nm = st.t;
  return `<div class="pair">
      <div class="tm c${m.play[0]}">${esc(nm[m.play[0]])}</div>
      <span class="vs">vs</span>
      <div class="tm c${m.play[1]}">${esc(nm[m.play[1]])}</div>
    </div>
    <p class="rest">Au repos : <b>${esc(nm[m.rest])}</b></p>`;
}

function renderTeams() {
  const box = $('teams');
  if (st.mode === 'setup') {
    box.innerHTML = `<section class="card">
      <div class="head"><h2>Les 3 équipes</h2></div>
      ${[0, 1, 2].map(i => `<label style="--c:var(--c${i})"><span></span>Équipe ${i + 1}<input id="in${i}" maxlength="24" autocomplete="off" placeholder="Nom de l'équipe ${i + 1}" value="${esc(st.t[i])}"></label>`).join('')}
      <h2 class="sub">Ordre des jams</h2>
      <p class="hint">Pour chaque jam, touche l'équipe qui reste au repos. Après la dernière jam de la liste, on recommence à la jam 1.</p>
      ${orderRows()}
      <div class="oact">
        <button class="btn" data-act="addjam">Ajouter une jam</button>
        ${st.rest.length > 1 ? '<button class="btn" data-act="rmjam">Retirer la dernière</button>' : ''}
      </div>
      <button class="btn primary" data-act="go">Afficher les jams</button>
      <button class="link" data-act="skip">Utiliser le minuteur seul</button>
    </section>`;
    return;
  }
  if (st.mode === 'solo') {
    box.innerHTML = `<button class="link" data-act="edit">Ajouter les équipes</button>`;
    return;
  }
  box.innerHTML = `<section class="card">
      <div class="head"><h2>Jam ${st.jam + 1}</h2><span class="tag">en cours</span></div>
      ${pair(st.jam)}
      <button class="btn primary go" data-act="next">Jam suivant</button>
    </section>
    <section class="card next">
      <div class="head"><h2>Jam ${st.jam + 2}</h2><span class="tag">ensuite</span></div>
      ${pair(st.jam + 1)}
    </section>
    <div class="foot">
      ${st.jam > 0 ? '<button class="link" data-act="prev">Jam précédent</button>' : ''}
      <button class="link" data-act="edit">Modifier les équipes et l'ordre</button>
      <button class="link" data-act="restart">Revenir à la jam 1</button>
    </div>`;
}

$('teams').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'go') {
    st.t = [0, 1, 2].map(i => $('in' + i).value.trim() || 'Équipe ' + (i + 1));
    st.mode = 'match';
  } else if (act === 'rest') {
    readNames();
    st.rest[Number(b.dataset.k)] = Number(b.dataset.i);
  } else if (act === 'addjam') {
    readNames();
    if (st.rest.length < 12) st.rest.push(DEFAULT_REST[st.rest.length % 3]);
  } else if (act === 'rmjam') {
    readNames();
    if (st.rest.length > 1) st.rest.pop();
  } else if (act === 'skip') {
    st.mode = 'solo';
  } else if (act === 'edit') {
    st.mode = 'setup';
  } else if (act === 'next') {
    st.jam++;
    resetTimer();
  } else if (act === 'prev') {
    st.jam = Math.max(0, st.jam - 1);
    resetTimer();
  } else if (act === 'restart') {
    if (!confirm('Revenir à la jam 1 ?')) return;
    st.jam = 0;
    resetTimer();
  }
  save();
  renderTeams();
});

drawTimer();
renderTeams();
</script>
</body>
</html>
